name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - run: npm install
    - run: npm run test
        
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag j3-todo-api:latest

    - name: Add tag before push
      run: docker tag j3-todo-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/j3-todo-api:latest

    - name: Push on Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/j3-todo-api:latest
