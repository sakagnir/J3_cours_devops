name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set tag
        run: echo "TAG=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

      - run: npm install
      - run: npm run test

      - name: Add tag before push
        run: docker tag j3-todo-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/j3-todo-api:${{env.TAG}}
        
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag j3-todo-api:${{env.TAG}}

  deploy:
    needs: [build]
    runs-on: self-hosted
    
    steps:
    - uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push on Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/j3-todo-api:${{env.TAG}}

